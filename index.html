<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="English conversation lessons for intermediate learners - Designed for Mexican adult learners working in Taiwan-based companies">
    <title>English Conversation with Elisa - Intermediate</title>
    <link rel="stylesheet" href="style-intermediate.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>📚 English Conversation with Elisa</h1>
            <span class="level-badge">Intermediate Level</span>
            <!-- Search Box -->
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search lessons..."
                    aria-label="Search lessons"
                >
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Welcome Section -->
            <div id="welcomeSection">
                <!-- Welcome Card -->
                <div class="welcome-card">
                    <h2>Welcome to Taigene Mexico English Hub - Intermediate Level! 👋</h2>
                    <p>Conversation withElisa every Monday, Wednesday, and Friday from 15:30 to 16:30.</p>
                </div>

                <!-- Calendar View -->
                <div id="calendarView">
                    <!-- Generated by JavaScript -->
                    <div class="loading">Loading lessons</div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
