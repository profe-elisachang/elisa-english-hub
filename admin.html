<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台管理系統 - Elisa English Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

         body {
             font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft JhengHei', sans-serif;
             background: #ecf3f8;
             min-height: 100vh; 
             padding: 20px;
         }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

         .header {
             background: #66acd9;
             color: white;
             padding: 2rem;
             text-align: center;
         }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            background: transparent;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            background: white;
            color: #66acd9;
            border-bottom: 3px solid #66acd9;
        }

        .tab:hover {
            background: #f0f0f0;
        }

        .content {
            padding: 2rem;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #66acd9;
        }

        .form-group textarea {
            min-height: 300px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #66acd9;
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 172, 217, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .output-section {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #66acd9;
        }

        .output-section h3 {
            margin-bottom: 1rem;
            color: #333;
        }

        .output-code {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 1rem;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }

        .copy-btn {
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .copy-btn:hover {
            background: #218838;
        }

        .lesson-list {
            margin-top: 2rem;
        }

        .lesson-item {
            background: #f8f9fa;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            border-left: 4px solid #66acd9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lesson-info {
            flex: 1;
        }

        .lesson-info h4 {
            margin-bottom: 0.5rem;
            color: #333;
        }

        .lesson-info p {
            color: #666;
            font-size: 0.9rem;
        }

        .lesson-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .btn-edit {
                background: #66acd9;
            color: white;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .image-preview {
            margin-top: 0.5rem;
            max-width: 100%;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .lesson-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .lesson-actions {
                margin-top: 1rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Elisa English Hub - 後台管理系統</h1>
            <p>管理 Intermediate 和 Advanced 課程文章</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('new')">新增文章</button>
            <button class="tab" onclick="switchTab('edit')">編輯文章</button>
        </div>

        <div class="content">
            <!-- 新增文章 Tab -->
            <div id="tab-new" class="tab-content active">
                <form id="newArticleForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="level">課程等級 *</label>
                            <select id="level" required>
                                <option value="intermediate">Intermediate</option>
                                <option value="advanced">Advanced</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">發布日期 *</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="title">文章標題（含 emoji）*</label>
                        <input type="text" id="title" placeholder="例如：🧠 The Science of Memory" required>
                    </div>

                    <div class="form-group">
                        <label for="imageUrl">圖片 URL（選填）</label>
                        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
                        <small style="color: #666; display: block; margin-top: 0.5rem;">圖片會顯示在文章 header 之後</small>
                        <img id="imagePreview" class="image-preview" style="display: none;" alt="預覽">
                    </div>

                    <div class="form-group">
                        <label for="filename">檔案名稱 *</label>
                        <input type="text" id="filename" placeholder="例如：The Science of Memory.html" required>
                        <small style="color: #666; display: block; margin-top: 0.5rem;">不需要包含資料夾路徑，系統會自動處理</small>
                    </div>

                    <div class="form-group">
                        <label for="htmlContent">HTML 內容 *</label>
                        <textarea id="htmlContent" placeholder="貼上完整的 HTML 語法..." required></textarea>
                    </div>

                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">生成檔案</button>
                        <button type="button" class="btn btn-secondary" onclick="previewArticle()">預覽</button>
                        <button type="reset" class="btn btn-secondary">清除</button>
                    </div>
                </form>

                <div id="outputSection" class="output-section" style="display: none;">
                    <h3>📋 生成的檔案內容</h3>
                    <div class="output-code" id="outputCode"></div>
                    <button class="copy-btn" onclick="copyToClipboard('outputCode')">複製 HTML 內容</button>
                </div>

                <div id="scriptOutputSection" class="output-section" style="display: none; margin-top: 1rem;">
                    <h3>📝 script.js 更新代碼</h3>
                    <div class="output-code" id="scriptOutputCode"></div>
                    <button class="copy-btn" onclick="copyToClipboard('scriptOutputCode')">複製 script.js 代碼</button>
                </div>
            </div>

            <!-- 編輯文章 Tab -->
            <div id="tab-edit" class="tab-content">
                <div class="form-group">
                    <label for="editLevel">選擇課程等級</label>
                    <select id="editLevel" onchange="loadLessons()">
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>

                <div id="lessonList" class="lesson-list">
                    <p style="color: #666; text-align: center; padding: 2rem;">載入中...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 設定今天的日期為預設值
        document.getElementById('date').valueAsDate = new Date();

        // 圖片預覽
        document.getElementById('imageUrl').addEventListener('input', function(e) {
            const url = e.target.value;
            const preview = document.getElementById('imagePreview');
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
                preview.onerror = function() {
                    preview.style.display = 'none';
                };
            } else {
                preview.style.display = 'none';
            }
        });

        // Tab 切換
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'new') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('tab-new').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('tab-edit').classList.add('active');
                loadLessons();
            }
        }

        // 表單提交
        document.getElementById('newArticleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            generateFiles();
        });

        // 生成檔案
        function generateFiles() {
            const level = document.getElementById('level').value;
            const date = document.getElementById('date').value;
            const title = document.getElementById('title').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const filename = document.getElementById('filename').value;
            const htmlContent = document.getElementById('htmlContent').value;

            // 確保檔名有 .html 後綴
            const finalFilename = filename.endsWith('.html') ? filename : filename + '.html';

            // 生成完整的 HTML 檔案內容
            let fullHtml = htmlContent;

            // 如果有圖片 URL，在 header 之後插入圖片
            if (imageUrl) {
                // 嘗試找到 </header> 標籤，在其後插入圖片
                const headerEndIndex = fullHtml.indexOf('</header>');
                if (headerEndIndex !== -1) {
                    const imageHtml = `\n    <img src="${imageUrl}" alt="${title}" class="article-image" style="width: 100%; max-width: 100%; height: auto; display: block; margin: 20px auto; border-radius: 8px;">\n`;
                    fullHtml = fullHtml.slice(0, headerEndIndex + 9) + imageHtml + fullHtml.slice(headerEndIndex + 9);
                } else {
                    // 如果找不到 </header>，嘗試找 <body> 之後
                    const bodyIndex = fullHtml.indexOf('<body>');
                    if (bodyIndex !== -1) {
                        const bodyEndIndex = fullHtml.indexOf('>', bodyIndex) + 1;
                        const imageHtml = `\n    <img src="${imageUrl}" alt="${title}" class="article-image" style="width: 100%; max-width: 100%; height: auto; display: block; margin: 20px auto; border-radius: 8px;">\n`;
                        fullHtml = fullHtml.slice(0, bodyEndIndex) + imageHtml + fullHtml.slice(bodyEndIndex);
                    }
                }
            }

            // 顯示 HTML 內容
            document.getElementById('outputCode').textContent = fullHtml;
            document.getElementById('outputSection').style.display = 'block';

            // 生成 script.js 更新代碼
            const folder = level === 'intermediate' ? 'intermediate/' : 'advanced/';
            const scriptLine = `        { filename: '${finalFilename}', date: '${date}', title: '${title.replace(/'/g, "\\'")}' },\n`;
            
            const scriptCode = `// 在 ${level === 'intermediate' ? 'script.js' : 'script-advanced.js'} 的 potentialFiles 陣列中添加：\n\n${scriptLine}\n// 👆 在此上方添加新文章，記得加逗號！`;

            document.getElementById('scriptOutputCode').textContent = scriptCode;
            document.getElementById('scriptOutputSection').style.display = 'block';

            // 顯示成功訊息
            showAlert('success', '檔案內容已生成！請複製並儲存。');
        }

        // 複製到剪貼簿
        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            
            navigator.clipboard.writeText(text).then(function() {
                showAlert('success', '已複製到剪貼簿！');
            }, function() {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showAlert('success', '已複製到剪貼簿！');
            });
        }

        // 顯示提示訊息
        function showAlert(type, message) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            
            const content = document.querySelector('.content');
            content.insertBefore(alert, content.firstChild);
            
            setTimeout(() => {
                alert.remove();
            }, 3000);
        }

        // 預覽文章
        function previewArticle() {
            const htmlContent = document.getElementById('htmlContent').value;
            const imageUrl = document.getElementById('imageUrl').value;
            const title = document.getElementById('title').value;

            if (!htmlContent) {
                showAlert('error', '請先輸入 HTML 內容');
                return;
            }

            let previewHtml = htmlContent;
            
            // 插入圖片
            if (imageUrl) {
                const headerEndIndex = previewHtml.indexOf('</header>');
                if (headerEndIndex !== -1) {
                    const imageHtml = `\n    <img src="${imageUrl}" alt="${title}" class="article-image" style="width: 100%; max-width: 100%; height: auto; display: block; margin: 20px auto; border-radius: 8px;">\n`;
                    previewHtml = previewHtml.slice(0, headerEndIndex + 9) + imageHtml + previewHtml.slice(headerEndIndex + 9);
                }
            }

            const previewWindow = window.open('', '_blank');
            previewWindow.document.write(previewHtml);
            previewWindow.document.close();
        }

        // 載入文章列表（用於編輯功能）
        async function loadLessons() {
            const level = document.getElementById('editLevel').value;
            const folder = level === 'intermediate' ? 'intermediate/' : 'advanced/';
            const scriptFile = level === 'intermediate' ? 'script.js' : 'script-advanced.js';

            const lessonList = document.getElementById('lessonList');
            lessonList.innerHTML = '<p style="color: #666; text-align: center; padding: 2rem;">載入中...</p>';

            try {
                const response = await fetch(scriptFile);
                const scriptContent = await response.text();

                // 解析 potentialFiles 陣列 - 改進的解析邏輯
                const arrayMatch = scriptContent.match(/const potentialFiles = \[([\s\S]*?)\];/);
                if (!arrayMatch) {
                    lessonList.innerHTML = '<p style="color: #dc3545; text-align: center; padding: 2rem;">無法解析文章列表<br><small>請確認 ' + scriptFile + ' 檔案存在</small></p>';
                    return;
                }

                const arrayContent = arrayMatch[1];
                
                // 移除註解行
                const linesWithoutComments = arrayContent.split('\n').filter(line => {
                    const trimmed = line.trim();
                    return trimmed && !trimmed.startsWith('//') && !trimmed.startsWith('*');
                }).join('\n');

                // 使用正則表達式匹配所有物件
                const objectPattern = /\{\s*filename:\s*['"]([^'"]+)['"]\s*,\s*date:\s*['"]([^'"]+)['"](?:\s*,\s*title:\s*['"]([^'"]+)['"])?\s*\}/g;
                let match;
                let html = '';
                let count = 0;

                while ((match = objectPattern.exec(linesWithoutComments)) !== null) {
                    const filename = match[1];
                    const date = match[2];
                    const title = match[3] || filename.replace('.html', '').replace(/-/g, ' ');

                    // 轉義特殊字元以便在 HTML 和 JavaScript 中使用
                    const escapedTitle = title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const escapedFilename = filename.replace(/'/g, "\\'");

                    html += `
                        <div class="lesson-item">
                            <div class="lesson-info">
                                <h4>${title}</h4>
                                <p>📅 ${date} | 📁 ${filename}</p>
                            </div>
                            <div class="lesson-actions">
                                <button class="btn btn-small btn-edit" onclick="editLesson('${level}', '${escapedFilename}', '${date}', '${escapedTitle}')">編輯</button>
                            </div>
                        </div>
                    `;
                    count++;
                }

                if (html === '') {
                    lessonList.innerHTML = '<p style="color: #666; text-align: center; padding: 2rem;">目前沒有文章<br><small>請先在 ' + scriptFile + ' 中添加文章</small></p>';
                } else {
                    lessonList.innerHTML = `<p style="color: #666; margin-bottom: 1rem; font-size: 0.9rem;">找到 ${count} 篇文章：</p>` + html;
                }
            } catch (error) {
                console.error('載入錯誤:', error);
                lessonList.innerHTML = '<p style="color: #dc3545; text-align: center; padding: 2rem;">載入失敗：' + error.message + '<br><small>請確認檔案路徑正確</small></p>';
            }
        }

        // 編輯文章
        function editLesson(level, filename, date, title) {
            // 切換到新增文章 tab 並填入資料
            switchTab('new');
            
            document.getElementById('level').value = level;
            document.getElementById('date').value = date;
            document.getElementById('title').value = title;
            document.getElementById('filename').value = filename;

            // 載入文章內容
            const folder = level === 'intermediate' ? 'intermediate/' : 'advanced/';
            fetch(folder + filename)
                .then(response => response.text())
                .then(html => {
                    // 移除圖片標籤（如果有的話）
                    let cleanHtml = html.replace(/<img[^>]*class="article-image"[^>]*>/gi, '');
                    
                    // 提取圖片 URL（如果有的話）
                    const imageMatch = html.match(/<img[^>]*src="([^"]+)"[^>]*class="article-image"/i);
                    if (imageMatch) {
                        document.getElementById('imageUrl').value = imageMatch[1];
                        document.getElementById('imagePreview').src = imageMatch[1];
                        document.getElementById('imagePreview').style.display = 'block';
                    }

                    document.getElementById('htmlContent').value = cleanHtml;
                    
                    // 滾動到表單
                    document.querySelector('.content').scrollIntoView({ behavior: 'smooth' });
                })
                .catch(error => {
                    showAlert('error', '無法載入文章內容：' + error.message);
                });
        }
    </script>
</body>
</html>
