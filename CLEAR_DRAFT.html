<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除草稿工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 3rem;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            text-align: center;
        }
        
        .info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 8px;
        }
        
        .draft-list {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .draft-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: white;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        
        .draft-item strong {
            color: #667eea;
            display: block;
            margin-bottom: 0.25rem;
        }
        
        .draft-item small {
            color: #666;
        }
        
        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }
        
        .btn-info {
            background: #17a2b8;
            color: white;
        }
        
        .btn-info:hover {
            background: #138496;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(23, 162, 184, 0.3);
        }
        
        .status {
            text-align: center;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 清除草稿工具</h1>
        
        <div class="info">
            <strong>📋 功能說明：</strong>
            <p>此工具可以幫助你清除瀏覽器中儲存的文章草稿，解決草稿彈窗循環的問題。</p>
        </div>
        
        <div class="draft-list" id="draftList">
            <strong>📦 目前儲存的草稿：</strong>
            <div id="draftContent" style="margin-top: 0.5rem;">載入中...</div>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-danger" onclick="clearAllDrafts()">
                🗑️ 清除所有草稿
            </button>
            <button class="btn btn-info" onclick="checkDrafts()">
                🔍 重新檢查
            </button>
        </div>
        
        <div id="status" class="status"></div>
    </div>
    
    <script>
        function checkDrafts() {
            const draftContent = document.getElementById('draftContent');
            const drafts = [];
            
            // 檢查中階草稿
            const intermediateDraft = localStorage.getItem('admin_draft_intermediate');
            if (intermediateDraft) {
                try {
                    const data = JSON.parse(intermediateDraft);
                    drafts.push({
                        key: 'admin_draft_intermediate',
                        level: '中階 (Intermediate)',
                        title: data.title || '未命名',
                        date: data.date || '未設定',
                        timestamp: data.timestamp ? new Date(data.timestamp).toLocaleString('zh-TW') : '未知'
                    });
                } catch (e) {
                    drafts.push({
                        key: 'admin_draft_intermediate',
                        level: '中階 (Intermediate)',
                        title: '錯誤的草稿資料',
                        error: true
                    });
                }
            }
            
            // 檢查進階草稿
            const advancedDraft = localStorage.getItem('admin_draft_advanced');
            if (advancedDraft) {
                try {
                    const data = JSON.parse(advancedDraft);
                    drafts.push({
                        key: 'admin_draft_advanced',
                        level: '進階 (Advanced)',
                        title: data.title || '未命名',
                        date: data.date || '未設定',
                        timestamp: data.timestamp ? new Date(data.timestamp).toLocaleString('zh-TW') : '未知'
                    });
                } catch (e) {
                    drafts.push({
                        key: 'admin_draft_advanced',
                        level: '進階 (Advanced)',
                        title: '錯誤的草稿資料',
                        error: true
                    });
                }
            }
            
            if (drafts.length === 0) {
                draftContent.innerHTML = '<div class="draft-item" style="background: #e8f5e9; border-color: #4caf50;">✅ 沒有草稿</div>';
            } else {
                draftContent.innerHTML = drafts.map(draft => `
                    <div class="draft-item">
                        <strong>${draft.level}</strong>
                        ${draft.error ? 
                            '<small style="color: #dc3545;">❌ 錯誤的草稿資料（建議刪除）</small>' : 
                            `
                            <small>📝 標題：${draft.title}</small><br>
                            <small>📅 日期：${draft.date}</small><br>
                            <small>⏰ 儲存時間：${draft.timestamp}</small>
                            `
                        }
                    </div>
                `).join('');
            }
        }
        
        function clearAllDrafts() {
            if (!confirm('確定要清除所有草稿嗎？此操作無法復原！')) {
                return;
            }
            
            try {
                localStorage.removeItem('admin_draft_intermediate');
                localStorage.removeItem('admin_draft_advanced');
                
                showStatus('success', '✅ 所有草稿已清除！');
                checkDrafts();
            } catch (e) {
                showStatus('error', '❌ 清除失敗：' + e.message);
            }
        }
        
        function showStatus(type, message) {
            const status = document.getElementById('status');
            status.className = 'status ' + type;
            status.textContent = message;
            
            if (type === 'success') {
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);
            }
        }
        
        // 頁面載入時檢查
        window.addEventListener('DOMContentLoaded', checkDrafts);
    </script>
</body>
</html>
